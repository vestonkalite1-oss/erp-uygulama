/* =========================================================================
   KALICI / PAYLAŞIMLI DEPOLAMA — window.storage (shared: true)
   Bu sayede farklı bilgisayarlardan girilen kayıtlar herkes için kalıcı ve ortak olur.
   ========================================================================= */
const cache = {};
function recKey(moduleId, subId) { return "records:" + moduleId + "__" + subId; }

async function loadRecords(moduleId, subId) {
  const key = recKey(moduleId, subId);
  if (cache[key]) return cache[key];
  try {
    const res = await window.storage.get(key, true);
    const parsed = res && res.value ? JSON.parse(res.value) : [];
    cache[key] = parsed;
    return parsed;
  } catch (e) {
    cache[key] = [];
    return [];
  }
}

let lastSaveError = "";
async function loadCopy(m, sub) { return JSON.parse(JSON.stringify(await loadRecords(m, sub))); }
async function saveRecords(moduleId, subId, records) {
  const key = recKey(moduleId, subId);
  const previous = cache[key];
  cache[key] = records;
  setSyncing(true);
  if (!window.storage) { lastSaveError = "depolama yok"; cache[key] = previous; setSyncing(false); return false; }
  for (let i = 0; i < 3; i++) {
    try {
      await window.storage.set(key, JSON.stringify(records), true);
      lastSaveError = ""; setSyncing(false); return true;
    } catch (e) {
      lastSaveError = String((e && e.message) || e);
      console.error("Kayıt hatası:", e);
      if (/Yetkiniz yok/.test(lastSaveError)) break;
      await new Promise(r => setTimeout(r, 400 * (i + 1)));
    }
  }
  cache[key] = previous; setSyncing(false); return false;
}
function saveErrText() {
  if (/Yetkiniz yok/.test(lastSaveError)) return "Yetkiniz yok: değiştirme ve silme yalnızca yetkili kullanıcıda.";
  return lastSaveError === "depolama yok"
    ? "Kayıt yapılamıyor: dosya Claude dışında açılmış (depolama yok). Dosyayı Claude içinde açın."
    : "Kayıt başarısız oldu" + (lastSaveError ? " (" + lastSaveError.slice(0, 80) + ")" : "") + ", tekrar deneyin.";
}

function formatFileSize(bytes) {
  if (!bytes) return "0 KB";
  const units = ["B", "KB", "MB", "GB"];
  let i = 0, val = bytes;
  while (val >= 1024 && i < units.length - 1) { val /= 1024; i++; }
  return `${val.toFixed(val < 10 && i > 0 ? 1 : 0)} ${units[i]}`;
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

let syncing = false;
function setSyncing(v) {
  syncing = v;
  const tag = document.getElementById("sync-tag");
  if (tag) {
    tag.className = "synctag" + (v ? " saving" : "");
    tag.innerHTML = `<span class="dot"></span> ${v ? "Kaydediliyor…" : (window.__localMode ? "Kayıtlı — bu bilgisayarda" : "Kayıtlı — paylaşımlı")}`;
  }
}

let state = { activeModule: "dashboard", activeSub: null, showForm: false, formError: "" };

function esc(v) {
  if (v === undefined || v === null) return "";
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function firstSubId(moduleId) { return Object.keys(MODULES[moduleId].subs)[0]; }

function renderNav() {

    { id: "dashboard", label: "Pano", icon: "▦" },
    { id: "terminal", label: "El Terminali", icon: "📟" },

    { id: "yetki", label: "Yetkiler", icon: "👤" },

      <span class="ic">${it.icon}</span> ${it.label}

}

function renderSubtabs(moduleId) {
  const cfg = MODULES[moduleId];
  return `<div class="subtabs">${Object.entries(cfg.subs).map(([subId, s]) => `
    <button class="subtab ${state.activeSub === subId ? "active" : ""}" data-subtab="${subId}">${s.label}</button>`).join("")}</div>`;
}

const UNIVERSAL_FIELDS = [
  { key: "ekLink", label: "Ek Dosya / Ekran Görüntüsü (Link)", type: "url" },
  { key: "ekAciklama", label: "Ek Açıklama", type: "text" },
];
function fullFields(sub) { return sub.skipUniversal ? sub.fields : sub.fields.concat(UNIVERSAL_FIELDS); }

function renderFormCard(moduleId, subId) {
  const sub = MODULES[moduleId].subs[subId];
  const fieldsHtml = fullFields(sub).map(f => {
    if (f.type === "select") {
      return `<label>${f.label}${f.required ? ' <span style="color:#C0392B">*</span>' : ""}
        <select name="${f.key}">${f.options.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("")}</select></label>`;
    }
    if (f.type === "file") {
      return `<label>${f.label}${f.required ? ' <span style="color:#C0392B">*</span>' : ""}
        <input type="file" name="${f.key}" />
        <span style="display:block;font-size:11px;color:#9AA3B2;font-weight:400;margin-top:3px">En fazla ~3,5 MB</span></label>`;
    }
    return `<label>${f.label}${f.required ? ' <span style="color:#C0392B">*</span>' : ""}
      <input type="${f.type}" name="${f.key}" class="${f.mono ? "mono" : ""}" /></label>`;
  }).join("");
  return `
    <form class="form-card" id="entry-form" data-module="${moduleId}" data-sub="${subId}" enctype="multipart/form-data">
      ${fieldsHtml}
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Kaydet</button>
        ${state.formError ? `<span class="error-msg">⚠ ${esc(state.formError)}</span>` : ""}
      </div>
    </form>`;
}

async function renderModulePage(moduleId) {
  const cfg = MODULES[moduleId];
  if (!state.activeSub || !cfg.subs[state.activeSub]) state.activeSub = firstSubId(moduleId);
  const subId = state.activeSub;
  const sub = cfg.subs[subId];
  const allFields = fullFields(sub);
  if (state.moduleSearchText === undefined) state.moduleSearchText = "";
  const allRecords = await loadRecords(moduleId, subId);
  const q = state.moduleSearchText.trim().toLocaleLowerCase("tr");
  const records = q
    ? allRecords.filter(r => allFields.some(f => {
        const raw = f.type === "file" ? (r[f.key + "_adi"] || "") : (r[f.key] || "");
        return raw.toString().toLocaleLowerCase("tr").includes(q);
      }))
    : allRecords;
  const rows = records.length === 0
    ? `<tr class="empty-row"><td colspan="${allFields.length + 2}">${allRecords.length === 0 ? `Henüz kayıt yok. "Yeni Kayıt" ile başla.` : "Aramanızla eşleşen kayıt bulunamadı."}</td></tr>`
    : records.map(r => {
        const cells = allFields.map(f => {
          const val = r[f.key];
          if (f.mono) return `<td><span class="stamp">${esc(val) || "—"}</span></td>`;
          if (f.type === "file") {
            if (!val) return `<td>—</td>`;
            const adi = r[f.key + "_adi"] || "dosya";
            const boyut = r[f.key + "_boyut"];
            return `<td><a href="${val}" download="${esc(adi)}" style="color:#0B5ED7;font-weight:600;text-decoration:none">⬇ ${esc(adi)}</a>${boyut ? `<br><span style="font-size:11px;color:#9AA3B2">${formatFileSize(boyut)}</span>` : ""}</td>`;
          }
          if (f.type === "url") return val ? `<td><a href="${esc(val)}" target="_blank" rel="noopener noreferrer" style="color:#0B5ED7;font-weight:600;text-decoration:none">Dosyayı Aç ↗</a></td>` : `<td>—</td>`;
          if (f.type === "select" && STATUS_COLORS[val]) return `<td><span class="badge" style="background:${STATUS_COLORS[val]}">${esc(val)}</span></td>`;
          return `<td>${esc(val) || "—"}</td>`;
        }).join("");
        return `<tr>${cells}<td>${formatKayitTarihi(r._createdAt)}</td><td><button class="btn-plain" data-del="${r._id}" data-module="${moduleId}" data-sub="${subId}">✕</button></td></tr>`;
      }).join("");

  return `
    <div class="eyebrow">Modül</div>
    <h2 class="pagetitle">${cfg.label}</h2>
    <div class="divider-line"></div>
    ${renderSubtabs(moduleId)}
    <div class="headrow">
      <input id="module-search" type="text" placeholder="Bu tabloda ara… (ör. isim, no, tarih)"
        value="${esc(state.moduleSearchText)}"
        style="padding:8px 12px;border-radius:7px;border:1px solid #D7DCE3;font-size:13.5px;width:260px;font-family:inherit" />
      <button class="btn ${state.showForm ? "btn-dark" : "btn-primary"}" id="toggle-form">${state.showForm ? "✕ İptal" : "+ Yeni Kayıt"}</button>
    </div>
    <div class="eyebrow" style="margin:10px 0 -2px">${sub.label}${q ? ` — ${records.length}/${allRecords.length} kayıt eşleşti` : ""}</div>
    ${state.showForm ? renderFormCard(moduleId, subId) : ""}
    <div class="table-card"><div style="overflow-x:auto"><table>
      <thead><tr>${allFields.map(f => `<th>${f.label}</th>`).join("")}<th>Kayıt Tarihi</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>`;
}

function formatKayitTarihi(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "—";
  const pad = (n) => String(n).padStart(2, "0");
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

    loadRecords("ik", "personel"), loadRecords("kalite", "dof"), loadRecords("isg", "denetim"),
    loadRecords("kalite", "dokuman"), loadRecords("uretim", "takip"), loadRecords("kalite", "kontrol"),
  ]);

  const aktifPersonel = personel.filter(r => r.durum === "Aktif").length;
  const acikDof = dof.filter(r => r.durum === "Açık").length;
  const acikIsg = isgDenetim.filter(r => r.durum === "Açık").length;
  const yayindaDokuman = dokuman.filter(r => r.durum === "Yayında").length;

  const byDate = {};
  uretimTakip.forEach(r => { if (r.tarih) byDate[r.tarih] = (byDate[r.tarih] || 0) + (Number(r.gerceklesenAdet) || 0); });
  const chartEntries = Object.entries(byDate).sort((a, b) => a[0].localeCompare(b[0])).slice(-8);
  const maxVal = Math.max(1, ...chartEntries.map(e => e[1]));
  const barsHtml = chartEntries.length === 0
    ? `<div class="loading-box">Henüz üretim takip verisi yok</div>`
    : `<div class="bar-row">${chartEntries.map(([tarih, adet]) => `
        <div class="bar-col"><div class="bar-value">${adet}</div>
        <div class="bar" style="background:#0B5ED7;height:${Math.max(6, (adet / maxVal) * 160)}px"></div>
        <div class="bar-label">${tarih.slice(5)}</div></div>`).join("")}</div>`;

  const uygun = kaliteKontrol.filter(r => r.sonuc === "Uygun").length;
  const uygunDegil = kaliteKontrol.filter(r => r.sonuc === "Uygun Değil").length;
  const total = uygun + uygunDegil;
  let donutHtml;
  if (total === 0) {
    donutHtml = `<div class="loading-box">Henüz kalite kontrol verisi yok</div>`;
  } else {
    const p1 = (uygun / total) * 360;
    donutHtml = `<div class="donut-wrap">
      <div class="donut" style="background: conic-gradient(#1E8E5A 0deg ${p1}deg, #C0392B ${p1}deg 360deg);"></div>
      <div><div class="legend-item"><span class="legend-dot" style="background:#1E8E5A"></span> Uygun (${uygun})</div>
      <div class="legend-item"><span class="legend-dot" style="background:#C0392B"></span> Uygun Değil (${uygunDegil})</div></div></div>`;
  }

  const kpis = [
    { label: "Aktif Personel", value: aktifPersonel },
    { label: "Açık DÖF", value: acikDof },
    { label: "Açık İSG Bulgusu", value: acikIsg },
    { label: "Yayındaki Doküman", value: yayindaDokuman },
  ];

  return `
    <div class="eyebrow">Genel Bakış</div>
    <h2 class="pagetitle">Entegre Yönetim Sistemi — Pano</h2>
    <div class="divider-line"></div>
    <div class="kpi-grid">${kpis.map(k => `<div class="kpi-card"><div class="kpi-label">${k.label}</div><div class="kpi-value">${k.value}</div></div>`).join("")}</div>
    <div class="chart-grid">
      <div class="chart-card"><div class="chart-title">Günlük Üretim (son 8 gün)</div>${barsHtml}</div>
      <div class="chart-card"><div class="chart-title">Kalite Kontrol Sonuç Dağılımı</div>${donutHtml}</div>
    </div>
    <div class="footnote">${window.__cloud ? "Veriler bulut veritabanında tutulur; giriş yapan herkes aynı veriyi görür ve günceller." : window.__localMode ? "Veriler bu bilgisayarın tarayıcısında tutulur, başka bilgisayarlarla paylaşılmaz. Düzenli yedek alın (El Terminali ekranında)." : "Veriler paylaşımlı depoda tutulur — bu sohbeti/önizlemeyi açan herkes aynı veriyi görür ve güncelleyebilir."}</div>`;
}

const GENERIC_STANDARD_STEPS = [
  "Kapsam Belirleme: Standardın hangi süreç/lokasyon/ürünleri kapsayacağını netleştirin.",
  "Mevcut Durum (Boşluk) Analizi: Şu anki uygulamaları standardın şartlarıyla karşılaştırın.",

  "Eğitim ve Farkındalık: İlgili personeli standart şartları ve yeni süreçler konusunda eğitin.",
  "İç Denetim: Uygulamayı belgelendirme öncesi kendi ekibinizle denetleyin, uygunsuzlukları kapatın.",
  "Belgelendirme Denetimi: Akredite bir belgelendirme kuruluşu ile resmi denetimi gerçekleştirin.",
  "Sürekli İyileştirme: Periyodik iç/dış denetim ve yönetim gözden geçirmeleriyle sistemi canlı tutun.",
];

function buildTrainingDoc(tip, key) {
  const isStandart = tip === "standart";
  const item = isStandart ? STANDARDS.find(s => s.kod === key) : QC_METHODS.find(m => m.ad === key);
  if (!item) return null;
  const title = isStandart ? `${item.kod} — ${item.ad}` : item.ad;
  const sections = [];
  sections.push({ h: (isStandart ? item.kod : item.ad) + " Nedir?", body: [item.nedir || item.aciklama] });
  if (isStandart) {
    sections.push({ h: "Bölge / Kategori", body: [`${item.bolge} — ${item.kategori}`] });
    sections.push({ h: "Uygulama Yol Haritası", list: GENERIC_STANDARD_STEPS });
    sections.push({ h: "Not", body: ["Bu doküman standardın resmi metni değildir; kalite ekibi için hazırlanmış uygulama rehberi niteliğindedir. Standardın tam ve güncel metni için ilgili belgelendirme kuruluşuna (TSE, akredite denetim firmaları vb.) başvurulmalıdır."] });
  } else {
    sections.push({ h: "Kategori", body: [item.kategori] });
    sections.push({ h: "Uygulama Adımları", list: item.adimlar || [] });
    sections.push({ h: "Not", body: ["Bu yöntem genel kalite mühendisliği pratiğidir; kuruluşunuzun ihtiyacına göre uyarlanabilir."] });
  }
  return { title, sections };
}

function trainingDocHtml(doc) {
  const bodyHtml = doc.sections.map(s => `
    <h2>${esc(s.h)}</h2>
    ${s.list ? `<ul>${s.list.map(li => `<li>${esc(li)}</li>`).join("")}</ul>` : `<p>${esc(s.body.join(" "))}</p>`}
  `).join("");
  return `<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>${esc(doc.title)} — Eğitim Dokümanı</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; color: #1F2937; line-height: 1.6; padding: 0 20px; }
    h1 { font-size: 24px; border-bottom: 3px solid #0B5ED7; padding-bottom: 10px; }
    h2 { font-size: 16px; color: #0B5ED7; margin-top: 26px; }
    ul { padding-left: 20px; } li { margin-bottom: 6px; }
    .meta { color: #8A93A3; font-size: 12.5px; margin-bottom: 20px; }
    @media print { body { margin: 10px auto; } }
  </style></head><body>
  <h1>${esc(doc.title)}</h1>
  <div class="meta">Entegre Yönetim Sistemi — Eğitim Dokümanı · Hazırlanma Tarihi: ${formatKayitTarihi(new Date().toISOString())}</div>
  ${bodyHtml}
  </body></html>`;
}

function renderStandartDetay(tip, key) {
  const doc = buildTrainingDoc(tip, key);
  if (!doc) return `<div class="loading-box">Kayıt bulunamadı.</div>`;
  const bodyHtml = doc.sections.map(s => `
    <div class="chart-card" style="margin-bottom:12px">
      <div class="chart-title">${esc(s.h)}</div>
      ${s.list ? `<ul class="rank-list" style="list-style:disc;padding-left:18px">${s.list.map(li => `<li style="display:list-item;border:none;padding:4px 0">${esc(li)}</li>`).join("")}</ul>` : `<div style="font-size:13.5px;color:#45505F">${esc(s.body.join(" "))}</div>`}
    </div>`).join("");

  return `

    </div>
    ${bodyHtml}

}

async function renderAnaliz() {
  const [dof, uygunsuzluk, isgKaza, isgDenetim, uretimTakip, uretimFire, uretimDurus, siparis, faturalar] = await Promise.all([
    loadRecords("kalite", "dof"), loadRecords("kalite", "uygunsuzluk"), loadRecords("isg", "kaza"),
    loadRecords("isg", "denetim"), loadRecords("uretim", "takip"), loadRecords("uretim", "fire"),
    loadRecords("uretim", "durus"), loadRecords("satinalma", "siparis"), loadRecords("muhasebe", "fatura"),
  ]);

  // 1) Kalite performans skoru: açık/kapalı DÖF oranı
  const dofKapali = dof.filter(r => r.durum === "Kapalı").length;
  const dofToplam = dof.length;
  const dofOran = dofToplam ? Math.round((dofKapali / dofToplam) * 100) : null;

  // 2) Üretim gerçekleşme oranı (hedef vs gerçekleşen)
  const toplamHedef = uretimTakip.reduce((s, r) => s + (Number(r.hedefAdet) || 0), 0);
  const toplamGerc = uretimTakip.reduce((s, r) => s + (Number(r.gerceklesenAdet) || 0), 0);
  const gerceklesmeOrani = toplamHedef ? Math.round((toplamGerc / toplamHedef) * 100) : null;

  // 3) Duruş nedenleri dağılımı
  const durusByNeden = {};
  uretimDurus.forEach(r => { const k = r.nedenTuru || "Diğer"; durusByNeden[k] = (durusByNeden[k] || 0) + (Number(r.sureDk) || 0); });
  const durusEntries = Object.entries(durusByNeden).sort((a, b) => b[1] - a[1]);
  const durusMax = Math.max(1, ...durusEntries.map(e => e[1]));

  // 4) Fire miktarı toplamı ürün bazlı, en çok fire veren ilk 5
  const fireByUrun = {};
  uretimFire.forEach(r => { const k = r.urun || "Belirtilmemiş"; fireByUrun[k] = (fireByUrun[k] || 0) + (Number(r.fireMiktar) || 0); });
  const fireEntries = Object.entries(fireByUrun).sort((a, b) => b[1] - a[1]).slice(0, 5);

  // 5) İSG olay/ramak kala oranı
  const kazaSayisi = isgKaza.filter(r => r.tur === "Kaza").length;
  const ramakKalaSayisi = isgKaza.filter(r => r.tur === "Ramak Kala").length;
  const isgAcikDenetim = isgDenetim.filter(r => r.durum === "Açık").length;

  // 6) Satın alma: bekleyen sipariş tutarı
  const bekleyenTutar = siparis.filter(r => r.durum === "Beklemede").reduce((s, r) => s + (Number(r.tutar) || 0), 0);
  const bekleyenFaturaTutar = faturalar.filter(r => r.durum === "Bekliyor").reduce((s, r) => s + (Number(r.tutar) || 0), 0);

  const scoreCards = [
    { label: "DÖF Kapatma Oranı", value: dofOran === null ? "—" : dofOran + "%", note: dofToplam ? `${dofKapali}/${dofToplam} kapatıldı` : "Henüz DÖF kaydı yok", color: dofOran === null ? "#8A93A3" : (dofOran >= 70 ? "#1E8E5A" : dofOran >= 40 ? "#C79A3D" : "#C0392B") },
    { label: "Üretim Gerçekleşme Oranı", value: gerceklesmeOrani === null ? "—" : gerceklesmeOrani + "%", note: toplamHedef ? `${toplamGerc}/${toplamHedef} adet` : "Henüz üretim verisi yok", color: gerceklesmeOrani === null ? "#8A93A3" : (gerceklesmeOrani >= 90 ? "#1E8E5A" : gerceklesmeOrani >= 70 ? "#C79A3D" : "#C0392B") },
    { label: "İSG Kaza / Ramak Kala", value: `${kazaSayisi} / ${ramakKalaSayisi}`, note: `${isgAcikDenetim} açık denetim bulgusu`, color: kazaSayisi > 0 ? "#C0392B" : "#1E8E5A" },
    { label: "Bekleyen Sipariş Tutarı", value: bekleyenTutar.toLocaleString("tr-TR"), note: `Bekleyen fatura: ${bekleyenFaturaTutar.toLocaleString("tr-TR")}`, color: "#0B5ED7" },
  ];

  const durusHtml = durusEntries.length === 0
    ? `<div class="loading-box">Henüz duruş verisi yok</div>`
    : `<ul class="rank-list">${durusEntries.map(([neden, dk]) => `
        <li><span>${esc(neden)}</span><span class="n">${dk} dk</span></li>`).join("")}</ul>`;

  const fireHtml = fireEntries.length === 0
    ? `<div class="loading-box">Henüz fire verisi yok</div>`
    : `<ul class="rank-list">${fireEntries.map(([urun, miktar]) => `
        <li><span>${esc(urun)}</span><span class="n">${miktar}</span></li>`).join("")}</ul>`;

  return `
    <div class="eyebrow">Değerlendirme</div>
    <h2 class="pagetitle">Analiz ve Değerlendirme</h2>
    <div class="divider-line"></div>
    <div class="kpi-grid">${scoreCards.map(k => `
      <div class="kpi-card" style="border-left-color:${k.color}">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value">${k.value}</div>
        <div class="kpi-sub">${k.note}</div>
      </div>`).join("")}</div>
    <div class="analiz-row">
      <div class="chart-card"><div class="chart-title">Duruş Nedenleri (toplam dakika)</div>${durusHtml}</div>
      <div class="chart-card"><div class="chart-title">En Çok Fire Veren Ürünler</div>${fireHtml}</div>
    </div>
    <div class="footnote">Bu pano, modüllere girilen verilerden otomatik hesaplanır; ayrı bir veri girişi gerektirmez.</div>`;
}

function currentTitle() {
  if (state.activeModule === "dashboard") return "Pano";
  if (state.activeModule === "terminal") return "El Terminali";
  if (state.activeModule === "etiket") return "Etiket Yazdır";
  if (state.activeModule === "yetki") return "Yetkiler";
  if (state.activeModule === "analiz") return "Analiz ve Değerlendirme";
  if (state.activeModule === "standartlar") return "Standartlar ve Metotlar";
  return MODULES[state.activeModule].label;
}

async function render() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="sidebar">
      <div class="brand">
        <div class="logo">EY</div>
        <div><div class="title">Entegre Yönetim Sistemi</div><div class="sub">v1.2 — Paylaşımlı</div></div>
      </div>
      <div class="navsection"><div class="navsection-label">Modüller</div>${renderNav()}</div>
    </div>
    <div class="main-wrap">
      <div class="topbar">
        <div class="breadcrumb">Entegre Yönetim Sistemi <b>/ ${currentTitle()}</b></div>
        <div class="topbar-right"><span class="synctag" id="sync-tag"><span class="dot"></span> Yükleniyor…</span></div>
      </div>
      <div class="main" id="main-content"><div class="loading-box">Yükleniyor…</div></div>
    </div>`;
  attachNavEvents();

  let html;
  if (state.activeModule === "dashboard") html = await renderDashboard();
  else if (state.activeModule === "terminal") { term.fresh = true; html = await renderTerminal(); }
  else if (state.activeModule === "etiket") html = await renderEtiket();
  else if (state.activeModule === "yetki") html = await renderYetki();
  else if (state.activeModule === "analiz") html = await renderAnaliz();
  else if (state.activeModule === "standartlar") html = renderStandartlar();
  else html = await renderModulePage(state.activeModule);

  document.getElementById("main-content").innerHTML = html;
  setSyncing(false);
  attachContentEvents();
  if (state.activeModule === "terminal") attachTerminalEvents();
  if (state.activeModule === "etiket") attachEtiketEvents();
  if (state.activeModule === "yetki" && rolu() === "admin") attachYetkiEvents();
}

function attachNavEvents() {
  document.querySelectorAll("[data-nav]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.activeModule = btn.getAttribute("data-nav");
      state.activeSub = null; state.showForm = false; state.formError = ""; state.standartDetay = null; state.moduleSearchText = "";
      render();
    });
  });
}

function attachContentEvents() {
  document.querySelectorAll("[data-standarttab]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.standartlarTab = btn.getAttribute("data-standarttab");
      state.standartDetay = null;
      render();
    });
  });

  document.querySelectorAll("[data-opendetay]").forEach(row => {
    row.addEventListener("click", () => {
      state.standartDetay = { tip: row.getAttribute("data-opendetay"), key: row.getAttribute("data-key") };
      render();
    });
  });

  const geriLink = document.getElementById("detay-geri");
  if (geriLink) {
    geriLink.addEventListener("click", (e) => {
      e.preventDefault();
      state.standartDetay = null;
      render();
    });
  }

  const docIndir = document.getElementById("doc-indir");
  if (docIndir) {
    docIndir.addEventListener("click", () => {
      const doc = buildTrainingDoc(state.standartDetay.tip, state.standartDetay.key);
      const html = trainingDocHtml(doc);
      const blob = new Blob([html], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = doc.title.replace(/[^\wÇĞİÖŞÜçğıöşü\s-]/g, "").replace(/\s+/g, "_") + ".html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }

  const docYazdir = document.getElementById("doc-yazdir");
  if (docYazdir) {
    docYazdir.addEventListener("click", () => {
      const doc = buildTrainingDoc(state.standartDetay.tip, state.standartDetay.key);
      const html = trainingDocHtml(doc);
      const win = window.open("", "_blank");
      win.document.write(html);
      win.document.close();
      setTimeout(() => win.print(), 300);
    });
  }

  const standartSearch = document.getElementById("standart-search");
  if (standartSearch) {
    standartSearch.addEventListener("input", () => {
      state.standartlarFilter = standartSearch.value;
      render();
      setTimeout(() => {
        const el = document.getElementById("standart-search");
        if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
      }, 0);
    });
  }

  document.querySelectorAll("[data-subtab]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.activeSub = btn.getAttribute("data-subtab");
      state.showForm = false; state.formError = ""; state.moduleSearchText = "";
      render();
    });
  });

  const moduleSearch = document.getElementById("module-search");
  if (moduleSearch) {
    moduleSearch.addEventListener("input", () => {
      state.moduleSearchText = moduleSearch.value;
      render();
      setTimeout(() => {
        const el = document.getElementById("module-search");
        if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
      }, 0);
    });
  }

  const toggleBtn = document.getElementById("toggle-form");
  if (toggleBtn) {
    toggleBtn.addEventListener("click", () => {
      state.showForm = !state.showForm; state.formError = "";
      render();
    });
  }

  const form = document.getElementById("entry-form");
  if (form) {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const moduleId = form.getAttribute("data-module");
      const subId = form.getAttribute("data-sub");
      const sub = MODULES[moduleId].subs[subId];
      const fd = new FormData(form);
      const record = { _id: newUuid(), _createdAt: new Date().toISOString() };
      const MAX_FILE_BYTES = 3.5 * 1024 * 1024;
      for (const f of fullFields(sub)) {
        if (f.type === "file") {
          const file = fd.get(f.key);
          if (file && file instanceof File && file.size > 0) {
            if (file.size > MAX_FILE_BYTES) {
              state.formError = `"${file.name}" çok büyük (${formatFileSize(file.size)}). En fazla ${formatFileSize(MAX_FILE_BYTES)} boyutunda dosya yükleyebilirsiniz.`;
              render();
              return;
            }
            try {
              record[f.key] = await readFileAsDataURL(file);
              record[f.key + "_adi"] = file.name;
              record[f.key + "_boyut"] = file.size;
              record[f.key + "_tipi"] = file.type;
            } catch (err) {
              state.formError = "Dosya okunurken bir hata oluştu, tekrar deneyin.";
              render();
              return;
            }
          } else {
            record[f.key] = "";
          }
        } else {
          record[f.key] = (fd.get(f.key) || "").toString().trim();
        }
      }
      const missing = sub.fields.find(f => f.required && !record[f.key]);
      if (missing) { state.formError = `"${missing.label}" alanı zorunlu.`; render(); return; }
      const records = await loadRecords(moduleId, subId);
      records.unshift(record);
      const ok = await saveRecords(moduleId, subId, records);
      if (!ok) {
        records.shift();
        state.formError = "Kayıt başarısız oldu — depolama sınırına ulaşılmış olabilir. Daha küçük bir dosya deneyin veya bu başlıktaki eski bir kaydı silip tekrar deneyin.";
        render();
        return;
      }
      state.showForm = false; state.formError = "";
      render();
    });
  }

  document.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const moduleId = btn.getAttribute("data-module");
      const subId = btn.getAttribute("data-sub");
      const id = btn.getAttribute("data-del");
      const records = (await loadRecords(moduleId, subId)).filter(r => r._id !== id);
      await saveRecords(moduleId, subId, records);
      render();
    });
  });
}

function termFeedback(ok) {
  try { if (navigator.vibrate) navigator.vibrate(ok ? 80 : [120, 60, 120]); } catch (e) {}

    if (!AC) return;

}

function termDT(iso, fallback) {

function yedekAl() {
  const o = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("erp:")) o[k] = localStorage.getItem(k); }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], { type: "application/json" }));
  a.download = "erp-yedek-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  term.msg = "Yedek dosyası indirildi."; term.kind = "ok"; refreshTerminal();
}
function yedekYukle(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      Object.keys(o).forEach(k => { if (k.startsWith("erp:")) localStorage.setItem(k, o[k]); });
      Object.keys(cache).forEach(k => delete cache[k]);
      term.msg = "Yedek yüklendi."; term.kind = "ok";
    } catch (e) { term.msg = "Yedek dosyası okunamadı."; term.kind = "err"; }
    refreshTerminal();
  };
  r.readAsText(file);
}

async function refreshTerminal(fresh) {
  if (fresh) term.fresh = true;
  const el = document.getElementById("main-content");
  if (!el) return;
  el.innerHTML = await renderTerminal();
  attachTerminalEvents();
}

/* Sevk etiketi barkodu (örnek): 20742 | 5 | 47021998 | 000064 | 161126 | ... → malzeme kodu, adet, tarih (ggaayy) */
/* Tanınmayan uzun rakam dizisi = büyük olasılıkla eksik/yanlış okunmuş etiket barkodu */
function barkodSuphe(text) { const t = String(text || "").trim(); return /^\d{15,}$/.test(t) && !parseEtiket(t); }
function parseEtiket(raw) {
  const fd = d => (+d.slice(0, 2) >= 1 && +d.slice(0, 2) <= 31 && +d.slice(2, 4) >= 1 && +d.slice(2, 4) <= 12) ? `${d.slice(0, 2)}.${d.slice(2, 4)}.20${d.slice(4, 6)}` : "—";
  const uf = /^UF(\d{12})(\d{6})(\d{6})(\d{6})(.+)$/i.exec(String(raw || "").trim());
  if (uf && parseInt(uf[2], 10) > 0) return { kimlik: true, kod: uf[5].trim(), adet: parseInt(uf[2], 10), tarih: `üretim ${fd(uf[3])} · sevk ${fd(uf[4])}` };
  const u = /^UE(\d{6})(\d{6})(\d{6})(.+)$/i.exec(String(raw || "").trim());
  if (u) {
    const adet = parseInt(u[1], 10);
    const f = d => (+d.slice(0, 2) >= 1 && +d.slice(0, 2) <= 31 && +d.slice(2, 4) >= 1 && +d.slice(2, 4) <= 12) ? `${d.slice(0, 2)}.${d.slice(2, 4)}.20${d.slice(4, 6)}` : "—";
    if (adet > 0) return { kimlik: true, kod: u[4].trim(), adet, tarih: `üretim ${f(u[2])} · sevk ${f(u[3])}` };
  }
  const m = /^(\d{5})(\d)(\d{8})(\d{6})(\d{6})(\d*)$/.exec(String(raw || "").trim());
  if (!m) return null;
  const gg = +m[5].slice(0, 2), aa = +m[5].slice(2, 4), yy = m[5].slice(4, 6);

}

async function termLookup(code) {
  if (!code) return;
  const nowT = Date.now();
  if (!term.ocrFlag && term.lastRaw === code && nowT - (term.lastAt || 0) < 2500) return;   // aynı barkodun çift okunması
  term.lastRaw = code; term.lastAt = nowT; term.dupRaw = "";
  if (!term.ocrFlag && barkodSuphe(code)) {
    term.msg = `Okunan "${code}" tanınan bir etiket biçimi değil, malzeme kodu olamaz. Barkod eksik okunmuş olabilir: etiketi tekrar okutun.`;

  }
  const ocr = term.ocrFlag; term.ocrFlag = false;
  const rawCode = code;

  if (pe) { code = pe.kod; term.preQty = pe.adet; term.etiket = `${ocr ? "FOTOĞRAFTAN OKUNDU — kodu ve adedi mutlaka kontrol edin. " : ""}Etiket okundu: ${pe.kod} · ${pe.adet} adet · ${pe.tarih}. Kontrol edip onaylayın.`; }

  const stok = await loadRecords("stok", "stokTakip");
  const rows = stok.filter(r => foldKod(r.malzemeKodu) === foldKod(code));
  term.note = "";
  if (rows.length) {
    const dz = { "Uygun": 0, "Onay Bekliyor": 0, "Ret": 0 };
    rows.forEach(r => { const d = DURUMLAR[r.durum] ? r.durum : "Uygun"; dz[d] += Number(r.miktar) || 0; });
    term.item = { malzemeKodu: rows[0].malzemeKodu, aciklama: (rows.find(r => r.aciklama) || {}).aciklama || "", birim: rows[0].birim || "", durumlar: dz };
    term.msg = term.etiket; term.kind = "ok"; termFeedback(true);
  } else if (term.mode === "giris") {
    term.item = { malzemeKodu: code, _new: true };
    term.msg = (term.etiket ? term.etiket + " " : "") + "Kayıtlı olmayan kod — onaylarsanız yeni malzeme olarak eklenir."; term.kind = "warn"; termFeedback(false);
  } else {
    term.item = null; term.msg = `"${code}" stok kaydında bulunamadı.`; term.kind = "err"; termFeedback(false);
  }
  const atla = term.skipDup === rawCode; term.skipDup = "";
  if (atla && term.item) { term.etiketId = ""; term.msg = "Yetkili onayıyla işleniyor: bu etiket mükerrer olarak kaydedilecek (etiket numarası bağlanmaz). " + (term.msg || ""); term.kind = "warn"; }
  else if (term.etiketId && term.item && window.__cloud && (term.mode === "giris" || term.mode === "cikis")) {
    try {
      const rows = await sbFetch("hareket?select=created_at,kullanici&limit=1&etiket=eq." + encodeURIComponent(term.etiketId) + "&tip=eq." + encodeURIComponent(TERM_MODES[term.mode].label));
      if (rows && rows.length) {
        const kim = String(rows[0].kullanici || "?").split("@")[0], ne = termDT(rows[0].created_at);
        term.msg = `BU ETİKET DAHA ÖNCE OKUTULDU (${ne}, ${kim}). İşlem yapılamaz.`; term.kind = "err";
        term.dupRaw = rolu() === "admin" ? rawCode : "";
        term.item = null; term.preQty = null; term.etiketId = "";
        termFeedback(false);
      }
    } catch (e) { /* kontrol yapılamazsa kayıt sırasında sunucu yine engeller */ }
  }
  if (ocr && term.item && term.kind !== "err") term.kind = "warn";
  refreshTerminal();
}

async function termConfirm() {
  const it = term.item;
  if (!it) return;
  const fail = (msg) => { term.msg = msg; term.kind = "err"; termFeedback(false); return refreshTerminal(); };
  const q = parseFloat(document.getElementById("term-qty").value);
  if (isNaN(q) || q < 0 || (term.mode !== "sayim" && q <= 0)) return fail("Geçerli bir miktar girin.");
  if (window.__cloud) {
    if (term.busy) return;
    term.busy = true;
    try {
      const note = ((document.getElementById("term-note") || {}).value || "").trim();
      if (term.mode === "durum") {
        if (term.hedef === "Ret" && !note) throw new Error("Ret için açıklama (ret nedeni) yazmalısınız.");
        await cloudRpc("durum_degistir", { p_kod: it.malzemeKodu, p_kaynak: term.durum, p_hedef: term.hedef, p_miktar: q, p_aciklama: note });
        term.msg = `${it.malzemeKodu}: ${q} adet ${term.durum} → ${term.hedef} aktarıldı`;
      } else {
        if (term.mode === "giris" && term.durum === "Ret" && !note) throw new Error("Ret girişi için açıklama (ret nedeni) yazmalısınız.");
        const r = await cloudRpc("stok_hareket", { p_kod: it.malzemeKodu, p_tip: TERM_MODES[term.mode].label, p_miktar: q, p_durum: term.durum, p_aciklama: note, p_etiket: (term.mode === "giris" || term.mode === "cikis") ? (term.etiketId || null) : null });
        term.msg = `${r.malzeme_kodu}: ${TERM_MODES[term.mode].label} ${q} (${term.durum}) — yeni ${term.durum} stoğu ${r.miktar}`;
      }
      cloudInvalidate();
      term.item = null; term.kind = "ok"; term.note = ""; term.etiketId = "";
      termFeedback(true); refreshTerminal(true);
    } catch (e) { fail(e.message); }
    finally { term.busy = false; }
    return;
  }

  const stok = await loadCopy("stok", "stokTakip");
  const stokOnce = JSON.parse(JSON.stringify(stok));
  let rec = it._id ? stok.find(r => r._id === it._id) : null;
  const onceki = rec ? (Number(rec.miktar) || 0) : 0;
  let yeni;
  if (term.mode === "giris") yeni = onceki + q;
  else if (term.mode === "cikis") {
    if (q > onceki) return fail(`Stokta yalnızca ${onceki} var, ${q} çıkış yapılamaz.`);
    yeni = onceki - q;
  } else yeni = q;
  yeni = Math.round(yeni * 1e6) / 1e6;

  const rid = () => Math.random().toString(36).slice(2, 10);
  const now = new Date();
  if (!rec) {
    rec = { _id: rid(), _createdAt: now.toISOString(), malzemeKodu: it.malzemeKodu, aciklama: "", miktar: "", birim: "", ekLink: "", ekAciklama: "" };
    stok.unshift(rec);
  }
  rec.miktar = String(yeni);
  rec._sonHareket = now.toISOString();

  const hareket = await loadCopy("stok", "hareket");
  const sayimId = rid();
  hareket.unshift({ _id: rid(), _createdAt: now.toISOString(), _onceki: onceki, _sayimId: term.mode === "sayim" ? sayimId : "", tarih: termDT(now.toISOString()),
    malzemeKodu: rec.malzemeKodu, tip: TERM_MODES[term.mode].label, miktar: String(q), yeniStok: String(yeni) });

  let okAll = await saveRecords("stok", "stokTakip", stok);
  okAll = okAll && await saveRecords("stok", "hareket", hareket);
  if (okAll && term.mode === "sayim") {
    const sayim = await loadCopy("stok", "sayim");
    sayim.unshift({ _id: sayimId, _createdAt: now.toISOString(),
      sayimNo: "SYM-" + now.toISOString().slice(0, 10).replace(/-/g, "") + "-" + rid().slice(0, 3).toUpperCase(),
      tarih: now.toISOString().slice(0, 10), malzemeKodu: rec.malzemeKodu,
      sistemMiktar: String(onceki), sayilanMiktar: String(q), ekLink: "", ekAciklama: "" });
    okAll = await saveRecords("stok", "sayim", sayim);
  }
  if (!okAll) { const et = saveErrText(); await saveRecords("stok", "stokTakip", stokOnce); return fail(et); }
  term.item = null; term.kind = "ok";
  term.msg = `${rec.malzemeKodu}: ${TERM_MODES[term.mode].label} ${q} — yeni stok ${yeni}`;
  termFeedback(true);
  refreshTerminal();
}

async function termUndo(id) {
  term.undoId = null;
  const fail = (msg) => { term.hmsg = msg; if (term.f.hIslem === "haric") term.f.hIslem = "tum"; termFeedback(false); return refreshTerminal(); };
  if (window.__cloud) {
    try {
      await cloudRpc("hareket_geri_al", { p_id: id });
      cloudInvalidate(); term.hmsg = ""; term.kind = "ok"; term.msg = "Hareket geri alındı.";
      termFeedback(true); refreshTerminal(true);
    } catch (e) { fail(e.message); }
    return;
  }
  const hareket = await loadCopy("stok", "hareket");
  const h = hareket.find(r => r._id === id);
  if (!h) return refreshTerminal();
  const norm = v => String(v || "").trim().toLocaleLowerCase("tr");
  const stok = await loadCopy("stok", "stokTakip");
  const stokOnce = JSON.parse(JSON.stringify(stok));
  const rec = stok.find(r => norm(r.malzemeKodu) === norm(h.malzemeKodu));
  const q = Number(h.miktar) || 0;
  let yeni = null;
  if (rec) {
    const mevcut = Number(rec.miktar) || 0;
    if (h.tip === "Giriş") {
      yeni = mevcut - q;
      if (yeni < 0) return fail(`Geri alınamaz: stok ${mevcut}, ${q} düşülürse eksiye iner. Önce sonraki çıkışları geri alın.`);
    } else if (h.tip === "Çıkış") {
      yeni = mevcut + q;
    } else {
      if (h._onceki === undefined) return fail("Bu sayım eski sürümde yapıldığı için otomatik geri alınamaz; Stok Takibi'nden miktarı elle düzeltin.");
      const sonraki = hareket.find(r => norm(r.malzemeKodu) === norm(h.malzemeKodu));
      if (!sonraki || sonraki._id !== id) return fail("Bu sayımdan sonra başka hareket var. Önce daha yeni hareketleri geri alın.");
      yeni = Number(h._onceki) || 0;
    }
    yeni = Math.round(yeni * 1e6) / 1e6;
    rec.miktar = String(yeni);
    rec._sonHareket = new Date().toISOString();
  }
  const kalan = hareket.filter(r => r._id !== id);
  // Terminalden otomatik açılmış (açıklaması boş), stoğu 0'a dönen ve başka hareketi kalmayan malzeme kaydı tamamen silinir
  let stokSave = stok, kayitSilindi = false;
  if (rec && yeni === 0 && !String(rec.aciklama || "").trim() && !String(rec.birim || "").trim()
      && !kalan.some(r => norm(r.malzemeKodu) === norm(h.malzemeKodu))) {
    stokSave = stok.filter(r => r !== rec); kayitSilindi = true;
  }
  let ok = await saveRecords("stok", "stokTakip", stokSave);
  ok = ok && await saveRecords("stok", "hareket", kalan);
  if (ok && h._sayimId) {
    const sayim = (await loadCopy("stok", "sayim")).filter(r => r._id !== h._sayimId);
    ok = await saveRecords("stok", "sayim", sayim);
  }
  if (!ok) { const et = saveErrText(); await saveRecords("stok", "stokTakip", stokOnce); return fail(et); }
  term.hmsg = ""; term.kind = "ok";
  term.msg = `${h.malzemeKodu}: ${h.tip} ${h.miktar} geri alındı` + (kayitSilindi ? " — malzeme kaydı da kaldırıldı" : (yeni !== null ? ` — stok ${yeni}` : ""));
  termFeedback(true);
  refreshTerminal();
}

const C128 = ["11011001100", "11001101100", "11001100110", "10010011000", "10010001100", "10001001100", "10011001000", "10011000100", "10001100100", "11001001000", "11001000100", "11000100100", "10110011100", "10011011100", "10011001110", "10111001100", "10011101100", "10011100110", "11001110010", "11001011100", "11001001110", "11011100100", "11001110100", "11101101110", "11101001100", "11100101100", "11100100110", "11101100100", "11100110100", "11100110010", "11011011000", "11011000110", "11000110110", "10100011000", "10001011000", "10001000110", "10110001000", "10001101000", "10001100010", "11010001000", "11000101000", "11000100010", "10110111000", "10110001110", "10001101110", "10111011000", "10111000110", "10001110110", "11101110110", "11010001110", "11000101110", "11011101000", "11011100010", "11011101110", "11101011000", "11101000110", "11100010110", "11101101000", "11101100010", "11100011010", "11101111010", "11001000010", "11110001010", "10100110000", "10100001100", "10010110000", "10010000110", "10000101100", "10000100110", "10110010000", "10110000100", "10011010000", "10011000010", "10000110100", "10000110010", "11000010010", "11001010000", "11110111010", "11000010100", "10001111010", "10100111100", "10010111100", "10010011110", "10111100100", "10011110100", "10011110010", "11110100100", "11110010100", "11110010010", "11011011110", "11011110110", "11110110110", "10101111000", "10100011110", "10001011110", "10111101000", "10111100010", "11110101000", "11110100010", "10111011110", "10111101110", "11101011110", "11110101110", "11010000100", "11010010000", "11010011100", "1100011101011"];

  const toC = () => { if (cur === null) { start = 105; cur = "C"; } else if (cur === "B") { out.push(99); cur = "C"; } };
  while (i < n) {

const etk = { tur: "stok", kod: "", acik: "", raf: "", adet: "", lot: "", tarih: new Date().toLocaleDateString("tr-TR"), uretim: new Date().toLocaleDateString("tr-TR"), sevk: "", kopya: 1, auto: "" };

function parseEtiketYazi(text) {

    if (son(email, "")) { msg("Son yetkili kullanıcı kaldırılamaz."); return; }
    try { await sbFetch("kullanici_rol?email=eq." + encodeURIComponent(email), { method: "DELETE", headers: { Prefer: "return=minimal" } }); await bitir(true); }
    catch (e) { msg("Kaldırılamadı: " + e.message); }
  }));
  const ek = document.getElementById("yt-ekle");
  if (ek) ek.addEventListener("click", async () => {
    const email = document.getElementById("yt-mail").value.trim().toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(email)) return msg("Geçerli bir e-posta yazın.");
    try { await sbFetch("kullanici_rol?on_conflict=email", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: { email, rol: document.getElementById("yt-rol").value } }); await bitir(true); }
    catch (e) { msg("Eklenemedi: " + e.message); }
  });
}

async function barkodFoto(file) {
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff;font:600 17px Arial;text-align:center;padding:20px";
  box.textContent = "Barkod aranıyor…";
  document.body.appendChild(box);
  const fail = (msg) => { term.msg = msg; term.kind = "err"; termFeedback(false); refreshTerminal(); };
  const yukle = (url) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; setTimeout(() => rej(new Error("zaman aşımı")), 10000); i.src = url; });
  let url = "";
  try {
    url = URL.createObjectURL(file);
    const img = await yukle(url);
    let src = img, kucuk = img;
    try {
      const sc = Math.min(1, 2200 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      src = cv; kucuk = await yukle(cv.toDataURL("image/jpeg", 0.92));
    } catch (e) { src = img; kucuk = img; }
    let text = "";
    if ("BarcodeDetector" in window) {
      try {
        const sup = await BarcodeDetector.getSupportedFormats();
        const want = ["code_128", "qr_code", "ean_13", "ean_8", "code_39"].filter(f => sup.includes(f));
        const r = await new BarcodeDetector({ formats: want }).detect(src);
        if (r.length && !barkodSuphe(r[0].rawValue)) text = r[0].rawValue;
      } catch (e) {}
    }
    if (!text) {
      await zxLoad();
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.CODE_39]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      text = (await new ZXing.BrowserMultiFormatReader(hints).decodeFromImageElement(kucuk)).getText();
    }
    box.remove(); URL.revokeObjectURL(url);
    if (!text) return fail("Fotoğrafta barkod bulunamadı.");
    if (barkodSuphe(text)) return fail("Barkod eksik ya da yanlış okundu. Barkodun tamamı fotoğrafta, düz ve net olsun, parlama olmasın; tekrar çekin.");
    termFeedback(true);
    termLookup(String(text).trim());
  } catch (e) {
    box.remove();
    fail("Fotoğraftan barkod okunamadı. Barkodu yakından, düz ve net çekin; barkodun tamamı fotoğrafta olsun, parlama olmasın.");
  }
}

async function kameraTesti() {
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;inset:0;z-index:10000;background:#fff;display:flex;flex-direction:column;font-family:Arial,sans-serif";
  box.innerHTML = `<div style="padding:14px 16px;font-weight:700;font-size:17px;border-bottom:1px solid #D5DBE3">🔧 Kamera testi</div>
    <pre id="kt-out" style="flex:1;margin:0;padding:14px 16px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:13px/1.5 monospace">Test yapılıyor… Kamera izni isterse "İzin ver" deyin.</pre>
    <div style="display:flex;gap:10px;padding:12px;border-top:1px solid #D5DBE3">
      <button id="kt-kopya" style="flex:1;padding:14px;font-size:16px;border-radius:10px;border:1px solid #CBD2DC;background:#fff">Kopyala</button>
      <button id="kt-kapat" style="flex:1;padding:14px;font-size:16px;font-weight:700;border-radius:10px;border:none;background:#0B5ED7;color:#fff">Kapat</button></div>`;
  document.body.appendChild(box);
  box.querySelector("#kt-kapat").addEventListener("click", () => box.remove());
  const out = box.querySelector("#kt-out"), sat = [];
  const yaz = (k, v) => { sat.push(k + ": " + v); out.textContent = sat.join("\n") + "\n…"; };
  box.querySelector("#kt-kopya").addEventListener("click", () => { try { navigator.clipboard.writeText(sat.join("\n")); } catch (e) {} });
  const ua = navigator.userAgent || "";
  yaz("Program sürümü", SURUM);
  yaz("Uygulama türü", (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) ? "Android uygulaması (yerel barkod okuyucu var)" : "web sayfası");
  yaz("Güvenli adres (https)", window.isSecureContext ? "evet" : "HAYIR");
  yaz("Açılış şekli", ((window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone) ? "ana ekran uygulaması" : "tarayıcı sekmesi");
  yaz("Tarayıcı bilgisi", ua);
  yaz("Uygulama içi tarayıcı olabilir mi", /; wv\)|FBAN|FBAV|Instagram|WhatsApp|Telegram|Line\//i.test(ua) ? "EVET (olası sorun)" : "hayır");
  const md = navigator.mediaDevices;
  yaz("Kamera API'si (mediaDevices)", md && md.getUserMedia ? "var" : "YOK");
  try { const pol = document.featurePolicy || document.permissionsPolicy; if (pol && pol.allowsFeature) yaz("Sayfada kameraya izin (permissions policy)", pol.allowsFeature("camera") ? "evet" : "HAYIR"); } catch (e) {}
  yaz("Barkod okuyucu (BarcodeDetector)", "BarcodeDetector" in window ? "var" : "yok (yedek okuyucu kullanılır)");
  try { yaz("Tarayıcı kamera izni", (await navigator.permissions.query({ name: "camera" })).state); } catch (e) { yaz("Tarayıcı kamera izni", "okunamadı (" + e.name + ")"); }
  try {
    const dv = (await md.enumerateDevices()).filter(d => d.kind === "videoinput");
    yaz("Görülen kamera sayısı", dv.length + (dv.length && dv.every(d => !d.label) ? " (adlar gizli: izin henüz verilmemiş olabilir)" : ""));
  } catch (e) { yaz("Kamera listesi", "hata " + e.name + ": " + e.message); }
  const dene = async (ad, c) => {
    try { const st = await md.getUserMedia(c); const tr = st.getVideoTracks()[0]; yaz(ad, "BAŞARILI (" + ((tr && tr.label) || "kamera") + ")"); st.getTracks().forEach(t => t.stop()); }
    catch (e) { yaz(ad, "HATA " + e.name + (e.message ? " — " + e.message : "")); }
  };
  if (md && md.getUserMedia) {
    await dene("Deneme 1 (basit kamera isteği)", { video: true, audio: false });
    await dene("Deneme 2 (arka kamera)", { video: { facingMode: { ideal: "environment" } }, audio: false });
  }
  out.textContent = sat.join("\n") + "\n\nTest bitti. Bu ekranın görüntüsünü gönderin.";
}

if (window.__cloud) {
  if (sbSession) cloudAfterLogin(); else cloudLoginScreen();
  setInterval(() => {
    const a = document.activeElement && document.activeElement.id;
    if (sbSession && state.activeModule === "terminal" && !term.item && !term.undoId && !term.busy && a !== "f-skod" && a !== "f-hkod") refreshTerminal(true);
  }, 30000);
} else render();
