name: Windows masaüstü uygulaması (EXE)

on:
  push:
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: masaustu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paketleri yükle
        run: npm ci
      - name: Kurulum dosyasını derle
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Kurulum dosyasını yayınla
        uses: actions/upload-artifact@v4
        with:
          name: ERP-Takip-Windows-Kurulum
          path: masaustu/dist/*.exe
